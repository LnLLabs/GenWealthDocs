site_name: GenWealth
site_description: GenWealth documentation — Cardano vaults, blockchain wills, crypto recovery, and claiming inheritance.
site_url: https://lnllabs.github.io/GenWealthDocs/
repo_url: https://github.com/LnLLabs/GenWealthDocs
repo_name: LnLLabs/GenWealthDocs
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow
extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Get started:
      - Welcome: index.md
      - Find a guide: find-a-guide.md
      - What you need to know about Cardano: cardano/what-you-need-to-know.md
      - Create a Cardano wallet: cardano/create-a-wallet.md
      - Fund your wallet: cardano/fund-your-wallet.md
      - Use your wallet with GenWealth: cardano/use-wallet-with-genwealth.md
  - User guides:
      - Create or enter a vault: guides/create-or-enter-vault.md
      - Use your vault wallet: guides/vault-wallet.md
      - Set up a blockchain will: guides/blockchain-will.md
      - Stay active and understand inheritance phases: guides/stay-active.md
      - Claim your inheritance: guides/claim-inheritance.md
      - Create and run a recovery plan: guides/recovery-plan.md
      - Change the vault owner: guides/change-owner.md
      - Fractionalize assets: guides/fractionalization.md
      - Swap and earn with Minswap: guides/minswap.md
      - Contacts and email notifications: guides/contacts-email.md
      - Help as an executor: guides/executor-guide.md
      - Stay safe: guides/safety.md
  - How GenWealth works:
      - Overview: how-it-works/overview.md
      - Proof of life: how-it-works/proof-of-life.md
      - Inheritance phases: how-it-works/inheritance-phases.md
      - Crypto recovery: how-it-works/recovery.md
      - What you still control: how-it-works/what-you-control.md
  - Whitepaper:
      - Cryptocurrencies and self-custody: whitepaper/self-custody.md
      - The problem: whitepaper/the-problem.md
      - How many bitcoins are lost forever?: whitepaper/lost-bitcoins.md
      - The inheritance problem in traditional finance: whitepaper/traditional-inheritance.md
      - Challenges of current recovery solutions: whitepaper/current-solutions.md
      - Conclusion: whitepaper/conclusion.md
      - The solution: whitepaper/the-solution.md
      - How it works: whitepaper/how-it-works.md
      - Claim process for beneficiaries: whitepaper/claim-process.md
      - Personal crypto recovery: whitepaper/personal-recovery.md
      - Completed roadmap: whitepaper/completed-roadmap.md
      - Future roadmap: whitepaper/future-roadmap.md
      - Future developments: whitepaper/future-developments.md
      - Services on top of the solution: whitepaper/services.md
  - Team and socials:
      - CEO — Rafael Cardoso: team/ceo.md
      - CTO — Leandros Holleman: team/cto.md
      - Socials: team/socials.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LnLLabs/GenWealthDocs
